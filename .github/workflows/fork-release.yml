name: Fork Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('macshot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build macshot app
        run: |
          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resolvePackageDependencies

          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign app
        run: |
          APP="build/Build/Products/Release/macshot.app"
          echo "Signing helper binaries and frameworks..."
          find "$APP/Contents" -name "*.dylib" -exec codesign --force --sign - {} + || true
          find "$APP/Contents/Frameworks" -name "*.framework" -exec codesign --force --sign - {} + || true
          echo "Signing main app with entitlements..."
          codesign --force --deep --sign - --entitlements macshot/macshot.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          echo "✅ Codesign complete."

      - name: Package DMG and Zip
        run: |
          APP="build/Build/Products/Release/macshot.app"
          echo "Packaging zip..."
          ditto -c -k --keepParent "$APP" MacShot.zip
          echo "Packaging DMG..."
          hdiutil create -volname "macshot" -srcfolder "$APP" -ov -format UDZO MacShot.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macshot-release
          path: |
            MacShot.dmg
            MacShot.zip
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v4.4.0-test"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MacShot.dmg MacShot.zip --clobber
          else
            gh release create "$TAG" MacShot.dmg MacShot.zip \
              --target "${{ github.ref_name }}" \
              --title "Test Build (Internal Audio Fixes)" \
              --notes "Ad-hoc signed test build for internal audio recording fix (#455) and export timescale fix (#448).

### How to open on macOS
Because this is an ad-hoc test build without a paid Apple Developer certificate:
1. Double-click **MacShot.dmg** and drag **macshot.app** to Applications (or extract **MacShot.zip**).
2. The first time you launch, **Right-click (or Control-click)** \`macshot.app\` and choose **Open**, then click **Open** in the confirmation dialog.
3. Or in Terminal, run: \`xattr -cr /Applications/macshot.app\`" \
              --prerelease
          fi
